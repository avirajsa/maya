[project]
name = "maya"
version = "0.1.0"
description = "Maya — Personal AI voice assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core / config
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    # Agent brain
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.0",
    # Voice
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "edge-tts>=6.1",
    "numpy>=1.26",
    # Memory
    "chromadb>=0.5",
    # Tools
    "duckduckgo-search>=6.0",
    "httpx>=0.27",
    # UI
    "chainlit>=1.3",
    # Logging
    "rich>=13.0",
    "av>=11,<19",
    "treemark>=0.1.0",
    "piper-tts>=1.8.0",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
voice-vad = [
    "webrtcvad-wheels>=2.0.11",
]
elevenlabs = [
    "elevenlabs>=1.9",
]

[project.scripts]
maya = "maya.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maya"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
